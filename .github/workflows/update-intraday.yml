name: Atualizar fotografia intradiária

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "scripts/refresh-intraday-v2.py"
      - ".github/workflows/update-intraday.yml"
  schedule:
    # A cada 15 minutos, em dias úteis, dentro da janela aproximada do pregão B3 em UTC.
    - cron: "*/15 13-20 * * 1-5"

permissions:
  contents: write

concurrency:
  group: atualizar-intraday
  cancel-in-progress: true

jobs:
  atualizar:
    runs-on: ubuntu-latest
    env:
      INTRADAY_SOURCE_URL: ${{ secrets.INTRADAY_SOURCE_URL }}
      BRAPI_TOKEN: ${{ secrets.BRAPI_TOKEN }}
      BOOK_SOURCE_URL: ${{ secrets.BOOK_SOURCE_URL }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Atualizar cotações e book quando disponível
        run: python scripts/refresh-intraday-v2.py
      - name: Publicar fotografia válida
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/intraday.json
          git diff --cached --quiet && exit 0
          git commit -m "Atualizar fotografia intradiária"
          git pull --rebase origin main
          git push origin HEAD:main
