name: Atualizar dados oficiais B3 e CVM

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/update-data.yml"
      - "scripts/**"
      - "site/src/analysis/**"
      - "site/src/quant/**"
      - "site/src/scoring/**"
  schedule:
    # Tentativas após o fechamento e à noite. Em UTC: 20:45 = 17:45 BRT,
    # 22:45 = 19:45 BRT e 01:15 = 22:15 BRT do dia anterior.
    # Rodamos em dias úteis e também no sábado de madrugada para autocura.
    - cron: "45 20 * * 1-5"
    - cron: "45 22 * * 1-5"
    - cron: "15 1 * * 2-6"

permissions:
  contents: write

concurrency:
  group: atualizar-dados-b3
  cancel-in-progress: false

jobs:
  atualizar:
    runs-on: ubuntu-latest
    timeout-minutes: 70
    steps:
      - name: Baixar o repositório
        uses: actions/checkout@v4

      - name: Preparar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Preparar Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: site/package-lock.json

      - name: Instalar dependências
        run: |
          python -m pip install --disable-pip-version-check openpyxl
          cd site && npm ci

      - name: Atualizar dados oficiais com autocura
        shell: bash
        run: |
          set -u
          sucesso=0
          for tentativa in 1 2 3; do
            echo "=== atualização oficial ${tentativa}/3 ==="
            if python scripts/refresh-data.py; then
              sucesso=1
              break
            fi
            echo "Fonte pública falhou; nova tentativa após pausa."
            git checkout -- data/ >/dev/null 2>&1 || true
            sleep $((tentativa * 45))
          done
          if [ "$sucesso" -ne 1 ]; then
            echo "As três tentativas falharam. O último snapshot válido permanece publicado."
            exit 1
          fi

      - name: Gerar diário automático do modelo
        run: node scripts/build-model-pulse.mjs

      - name: Gerar placar prospectivo do modelo
        run: node scripts/build-model-performance.mjs

      - name: Validar snapshot de ações e diário
        shell: bash
        run: |
          python - <<'PY'
          import json
          from datetime import date, datetime, timedelta, timezone
          from pathlib import Path

          status = json.loads(Path('data/status.json').read_text(encoding='utf-8'))
          if not status.get('ok'):
              raise SystemExit('status.json não está OK')
          if status.get('universe') != 'acoes_units':
              raise SystemExit(f"universo inesperado: {status.get('universe')}")
          if int(status.get('stockCount') or 0) < 250:
              raise SystemExit(f"ações/units insuficientes: {status.get('stockCount')}")
          if int(status.get('stockCvmCount') or 0) < 200:
              raise SystemExit(f"cobertura CVM insuficiente: {status.get('stockCvmCount')}")

          quote_date = date.fromisoformat(status.get('stockQuoteDate'))
          now_brt = datetime.now(timezone(timedelta(hours=-3)))
          expected = now_brt.date()
          # Após 19h BRT, em dia útil, o snapshot deve alcançar o pregão do próprio dia.
          # Antes disso, exigimos ao menos o último dia útil anterior. Feriados são
          # naturalmente tolerados porque a coleta oficial não inventa um pregão.
          if now_brt.weekday() < 5 and now_brt.hour >= 19:
              minimum_expected = expected
          else:
              minimum_expected = expected - timedelta(days=1)
              while minimum_expected.weekday() >= 5:
                  minimum_expected -= timedelta(days=1)
          if quote_date < minimum_expected and (minimum_expected - quote_date).days > 0:
              raise SystemExit(f"cotação B3 não alcançou o pregão esperado: obtido={quote_date}; mínimo={minimum_expected}")

          pulse = json.loads(Path('data/model-pulse.json').read_text(encoding='utf-8'))
          if not pulse.get('referenceDate') or not pulse.get('history'):
              raise SystemExit('diário do modelo não foi gerado corretamente')
          for strategy in ('swing', 'long', 'dividends'):
              info = (pulse.get('events') or {}).get(strategy) or {}
              if int(info.get('evaluated') or 0) < 100:
                  raise SystemExit(f'diário insuficiente em {strategy}: {info.get("evaluated")}')
          performance = json.loads(Path('data/model-performance.json').read_text(encoding='utf-8'))
          if performance.get('snapshotCount') is None:
              raise SystemExit('placar prospectivo ausente')
          benchmarks = json.loads(Path('data/benchmarks.json').read_text(encoding='utf-8'))
          ibov = (benchmarks.get('series') or {}).get('IBOV') or {}
          if ibov.get('status') != 'ATUALIZADO' or not ibov.get('series'):
              raise SystemExit('benchmark obrigatório indisponível: IBOV')
          ibov_date = date.fromisoformat(ibov.get('referenceDate'))
          if ibov_date < quote_date:
              raise SystemExit(f'IBOV ficou atrás do snapshot B3: IBOV={ibov_date}; B3={quote_date}')
          cdi = (benchmarks.get('series') or {}).get('CDI') or {}
          if cdi.get('status') != 'ATUALIZADO' or not cdi.get('series'):
              print('AVISO: CDI temporariamente indisponível no BCB; publicação do pregão B3 continuará sem falsificar o CDI.')
          else:
              cdi_date = date.fromisoformat(cdi.get('referenceDate'))
              if (date.today() - cdi_date).days > 7:
                  print(f'AVISO: CDI defasado ({cdi_date}); publicação do pregão B3 continuará e o app deve sinalizar a limitação.')
          print(status)
          print('Pregão B3 validado:', quote_date, 'mínimo esperado:', minimum_expected)
          print('Diário:', pulse.get('referenceDate'), {k: v.get('evaluated') for k, v in pulse['events'].items()})
          print('Placar:', performance.get('snapshotCount'), 'snapshots;', performance.get('evaluatedObservations'), 'observações maduras')
          print('IBOV:', ibov.get('referenceDate'), 'CDI:', cdi.get('referenceDate'), cdi.get('status'))
          PY

      - name: Validar histórico dos gráficos sem bloquear snapshot
        continue-on-error: true
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          path = Path('data/market-anomalies.json')
          if not path.exists() or path.stat().st_size < 100:
              raise SystemExit('market-anomalies.json ausente ou vazio')
          payload = json.loads(path.read_text(encoding='utf-8'))
          assets = payload.get('assets') or {}
          with_series = sum(1 for item in assets.values() if isinstance(item.get('series'), list) and len(item['series']) >= 30)
          if len(assets) < 50 or with_series < 50:
              raise SystemExit(f'histórico insuficiente: assets={len(assets)} series_validas={with_series}')
          print(f'Histórico OK: {len(assets)} ativos; {with_series} séries com 30+ pregões')
          PY

      - name: Validar motores de dados e frontend
        run: |
          python -m unittest discover -s scripts -p 'test_*.py' -v
          cd site && npm test

      - name: Salvar nova versão
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/
          if git diff --cached --quiet; then
            echo "Os dados já estão atualizados."
            exit 0
          fi
          git commit -m "Atualizar dados oficiais de ações, diário e placar do modelo"
          for tentativa in 1 2 3; do
            git fetch origin "${GITHUB_REF_NAME}"
            git rebase -X theirs "origin/${GITHUB_REF_NAME}"
            if git push origin "HEAD:${GITHUB_REF_NAME}"; then
              exit 0
            fi
            echo "A branch avançou; repetindo publicação ${tentativa}/3."
          done
          exit 1
