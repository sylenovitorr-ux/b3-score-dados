name: Atualizar dados oficiais B3 e CVM

# Atualização manual solicitada em 2026-08-17 22:18 America/Boa_Vista
on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/update-data.yml"
      - "scripts/**"
  schedule:
    # 19:17 em Boa Vista (UTC-4), todos os dias; no fim de semana o
    # fechamento permanece no último pregão, mas as notícias são renovadas.
    - cron: "17 23 * * *"

permissions:
  contents: write

concurrency:
  group: atualizar-dados-b3
  cancel-in-progress: false

jobs:
  atualizar:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Baixar o repositório
        uses: actions/checkout@v4

      - name: Preparar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar leitor da classificação setorial B3
        run: python -m pip install --disable-pip-version-check openpyxl

      - name: Atualizar dados
        run: python scripts/refresh-data.py

      - name: Validar histórico usado pelos gráficos
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          path = Path("data/market-anomalies.json")
          if not path.exists() or path.stat().st_size < 100:
              raise SystemExit("market-anomalies.json ausente ou vazio")
          payload = json.loads(path.read_text(encoding="utf-8"))
          assets = payload.get("assets") or {}
          with_series = sum(1 for item in assets.values() if isinstance(item.get("series"), list) and len(item["series"]) >= 30)
          if len(assets) < 50 or with_series < 50:
              raise SystemExit(f"Histórico insuficiente: assets={len(assets)} series_validas={with_series}")
          print(f"Histórico OK: {len(assets)} ativos; {with_series} séries com 30+ pregões")
          PY

      - name: Validar motores de dados
        run: python -m unittest discover -s scripts -p 'test_*.py' -v

      - name: Salvar nova versão
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/
          if git diff --cached --quiet; then
            echo "Os dados já estão atualizados."
            exit 0
          fi
          git commit -m "Atualizar dados oficiais B3 e CVM"
          # A atualização pode levar vários minutos. Nesse intervalo, outro
          # commit legítimo pode chegar à branch. Reaplique o commit de dados
          # sobre o HEAD remoto para preservar ambos, sem force push.
          git fetch origin "${GITHUB_REF_NAME}"
          # Durante um rebase, "theirs" é o commit de dados que está sendo
          # reaplicado. Assim, em conflito apenas entre arquivos gerados, a
          # execução mais recente prevalece e os demais commits são mantidos.
          git rebase -X theirs "origin/${GITHUB_REF_NAME}"
          for tentativa in 1 2 3; do
            if git push origin "HEAD:${GITHUB_REF_NAME}"; then
              exit 0
            fi
            echo "A branch avançou durante o envio; nova tentativa ${tentativa}/3."
            git fetch origin "${GITHUB_REF_NAME}"
            git rebase -X theirs "origin/${GITHUB_REF_NAME}"
          done
          echo "Não foi possível publicar os dados após três tentativas."
          exit 1
