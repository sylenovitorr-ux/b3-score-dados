name: Atualizar dados oficiais B3 e CVM

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/update-data.yml"
      - "scripts/**"
  schedule:
    - cron: "17 12 * * *"
    - cron: "17 18 * * *"
    - cron: "17 23 * * *"

permissions:
  contents: write

concurrency:
  group: atualizar-dados-b3
  cancel-in-progress: false

jobs:
  atualizar:
    runs-on: ubuntu-latest
    timeout-minutes: 70
    steps:
      - name: Baixar o repositório
        uses: actions/checkout@v4

      - name: Preparar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar dependências
        run: python -m pip install --disable-pip-version-check openpyxl

      - name: Desacoplar histórico gráfico do snapshot oficial
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('scripts/refresh-data.py')
          text = path.read_text(encoding='utf-8')
          old = 'subprocess.run([sys.executable, str(ROOT / "scripts/build-market-anomalies.py"), str(work)], check=True)'
          new = 'subprocess.run([sys.executable, str(ROOT / "scripts/build-market-anomalies.py"), str(work)], check=False)'
          if old in text:
              path.write_text(text.replace(old, new, 1), encoding='utf-8')
          PY

      - name: Atualizar dados oficiais com autocura
        shell: bash
        run: |
          set -u
          sucesso=0
          for tentativa in 1 2 3; do
            echo "=== atualização oficial ${tentativa}/3 ==="
            if python scripts/refresh-data.py; then
              sucesso=1
              break
            fi
            echo "Fonte pública falhou; nova tentativa após pausa."
            git checkout -- data/ >/dev/null 2>&1 || true
            sleep $((tentativa * 45))
          done
          if [ "$sucesso" -ne 1 ]; then
            echo "As três tentativas falharam. O último snapshot válido permanece publicado."
            exit 1
          fi

      - name: Validar snapshot principal
        shell: bash
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          status = json.loads(Path('data/status.json').read_text(encoding='utf-8'))
          if not status.get('ok'):
              raise SystemExit('status.json não está OK')
          if int(status.get('stockCount') or 0) < 250:
              raise SystemExit(f"ações insuficientes: {status.get('stockCount')}")
          if int(status.get('stockCvmCount') or 0) < 200:
              raise SystemExit(f"cobertura CVM insuficiente: {status.get('stockCvmCount')}")
          if int(status.get('fiiCount') or 0) < 150:
              raise SystemExit(f"FIIs insuficientes: {status.get('fiiCount')}")
          print(status)
          PY

      - name: Validar histórico dos gráficos sem bloquear snapshot
        continue-on-error: true
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          path = Path('data/market-anomalies.json')
          if not path.exists() or path.stat().st_size < 100:
              raise SystemExit('market-anomalies.json ausente ou vazio')
          payload = json.loads(path.read_text(encoding='utf-8'))
          assets = payload.get('assets') or {}
          with_series = sum(1 for item in assets.values() if isinstance(item.get('series'), list) and len(item['series']) >= 30)
          if len(assets) < 50 or with_series < 50:
              raise SystemExit(f'histórico insuficiente: assets={len(assets)} series_validas={with_series}')
          print(f'Histórico OK: {len(assets)} ativos; {with_series} séries com 30+ pregões')
          PY

      - name: Validar motores de dados
        run: python -m unittest discover -s scripts -p 'test_*.py' -v

      - name: Salvar nova versão
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -- scripts/refresh-data.py
          git add data/
          if git diff --cached --quiet; then
            echo "Os dados já estão atualizados."
            exit 0
          fi
          git commit -m "Atualizar dados oficiais B3 e CVM"
          for tentativa in 1 2 3; do
            git fetch origin "${GITHUB_REF_NAME}"
            git rebase -X theirs "origin/${GITHUB_REF_NAME}"
            if git push origin "HEAD:${GITHUB_REF_NAME}"; then
              exit 0
            fi
            echo "A branch avançou; repetindo publicação ${tentativa}/3."
          done
          exit 1
