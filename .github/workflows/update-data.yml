name: Atualizar dados oficiais B3 e CVM

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/update-data.yml"
      - "scripts/**"
  schedule:
    # 19:17 em Boa Vista (UTC-4), todos os dias; no fim de semana o
    # fechamento permanece no último pregão, mas as notícias são renovadas.
    - cron: "17 23 * * *"

permissions:
  contents: write

concurrency:
  group: atualizar-dados-b3
  cancel-in-progress: false

jobs:
  atualizar:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Baixar o repositório
        uses: actions/checkout@v4

      - name: Preparar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Atualizar dados
        run: python scripts/refresh-data.py

      - name: Validar motores de dados
        run: python -m unittest discover -s scripts -p 'test_*.py' -v

      - name: Salvar nova versão
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/
          if git diff --cached --quiet; then
            echo "Os dados já estão atualizados."
            exit 0
          fi
          git commit -m "Atualizar dados oficiais B3 e CVM"
          # A atualização pode levar vários minutos. Nesse intervalo, outro
          # commit legítimo pode chegar à branch. Reaplique o commit de dados
          # sobre o HEAD remoto para preservar ambos, sem force push.
          git pull --rebase origin "${GITHUB_REF_NAME}"
          git push origin "HEAD:${GITHUB_REF_NAME}"
