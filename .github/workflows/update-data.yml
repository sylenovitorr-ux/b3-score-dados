name: Atualizar dados oficiais B3 e CVM

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/update-data.yml"
      - "scripts/**"
      - "site/src/analysis/**"
      - "site/src/quant/**"
      - "site/src/scoring/**"
  schedule:
    - cron: "45 20 * * 1-5"
    - cron: "45 22 * * 1-5"
    - cron: "15 1 * * 2-6"

permissions:
  contents: write

concurrency:
  group: atualizar-dados-b3
  cancel-in-progress: true

jobs:
  atualizar:
    runs-on: ubuntu-latest
    timeout-minutes: 70
    steps:
      - name: Baixar o repositório
        uses: actions/checkout@v4

      - name: Preparar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # CAMINHO RÁPIDO: o fechamento da B3 é coletado e publicado primeiro.
      # Ele reutiliza os últimos fundamentos CVM já validados e não espera DFP/ITR/FCA.
      - name: Atualizar último pregão B3
        run: python scripts/refresh-market-fast.py

      - name: Validar fechamento rápido
        run: |
          python - <<'PY'
          import json
          from datetime import date
          from pathlib import Path

          status = json.loads(Path('data/status.json').read_text(encoding='utf-8'))
          if not status.get('ok'):
              raise SystemExit('status.json não está OK')
          if status.get('universe') != 'acoes_units':
              raise SystemExit(f"universo inesperado: {status.get('universe')}")
          if int(status.get('stockCount') or 0) < 250:
              raise SystemExit(f"ações/units insuficientes: {status.get('stockCount')}")
          quote_date = date.fromisoformat(status['stockQuoteDate'])
          if (date.today() - quote_date).days > 7:
              raise SystemExit(f'fechamento B3 claramente defasado: {quote_date}')
          print('Fechamento B3 aprovado para publicação:', quote_date)
          PY

      - name: Publicar fechamento B3 imediatamente
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/b3-catalog.json data/b3-fundamentals.json data/status.json data/benchmarks.json
          if git diff --cached --quiet; then
            echo "O último pregão oficial já está publicado."
          else
            git commit -m "Atualizar fechamento oficial B3"
            for tentativa in 1 2 3; do
              git fetch origin "${GITHUB_REF_NAME}"
              git rebase -X theirs "origin/${GITHUB_REF_NAME}"
              if git push origin "HEAD:${GITHUB_REF_NAME}"; then
                break
              fi
              if [ "$tentativa" -eq 3 ]; then exit 1; fi
              echo "A branch avançou; repetindo publicação ${tentativa}/3."
            done
          fi

      # CAMINHO PESADO: fundamentos, histórico, proventos e demais cálculos podem
      # demorar ou falhar sem impedir que o preço oficial recém-publicado continue válido.
      - name: Preparar Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: site/package-lock.json

      - name: Instalar dependências pesadas
        run: |
          python -m pip install --disable-pip-version-check openpyxl
          cd site && npm ci

      - name: Atualizar fundamentos e histórico
        id: heavy_refresh
        continue-on-error: true
        shell: bash
        run: |
          set -u
          sucesso=0
          for tentativa in 1 2; do
            echo "=== atualização completa ${tentativa}/2 ==="
            if timeout 35m python scripts/refresh-data.py; then
              sucesso=1
              break
            fi
            echo "Atualização completa falhou ou excedeu o tempo. O fechamento rápido permanece publicado."
            git checkout -- data/ >/dev/null 2>&1 || true
            sleep $((tentativa * 20))
          done
          if [ "$sucesso" -ne 1 ]; then
            exit 1
          fi

      - name: Publicar enriquecimento completo quando disponível
        if: steps.heavy_refresh.outcome == 'success'
        shell: bash
        run: |
          node scripts/build-model-pulse.mjs || true
          node scripts/build-model-performance.mjs || true
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/
          if git diff --cached --quiet; then
            echo "Sem enriquecimento adicional para publicar."
          else
            git commit -m "Atualizar fundamentos e histórico B3"
            for tentativa in 1 2 3; do
              git fetch origin "${GITHUB_REF_NAME}"
              git rebase -X theirs "origin/${GITHUB_REF_NAME}"
              if git push origin "HEAD:${GITHUB_REF_NAME}"; then
                break
              fi
              if [ "$tentativa" -eq 3 ]; then exit 1; fi
            done
          fi

      - name: Validar motores e frontend sem bloquear o pregão
        continue-on-error: true
        run: |
          python -m unittest discover -s scripts -p 'test_*.py' -v
          cd site && npm test
