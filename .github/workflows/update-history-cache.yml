name: Atualizar cache histórico diário

# Disparo manual da primeira geração em 2026-08-18 15:22 America/Manaus.
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "scripts/refresh-history-cache.py"
      - ".github/workflows/update-history-cache.yml"
  schedule:
    # Um lote por dia útil após o fechamento. Com 120 chamadas/dia útil,
    # o consumo mensal típico fica muito abaixo de 15 mil chamadas.
    - cron: "35 22 * * 1-5"

permissions:
  contents: write

concurrency:
  group: atualizar-history-cache
  cancel-in-progress: false

jobs:
  atualizar:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      BRAPI_TOKEN: ${{ secrets.BRAPI_TOKEN }}
      HISTORY_BATCH_SIZE: "120"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Gerar lote rotativo do histórico diário
        run: python scripts/refresh-history-cache.py

      - name: Validar cache e cobertura
        shell: bash
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          status_path = Path("data/history/status.json")
          if not status_path.exists():
              raise SystemExit("status do cache histórico ausente")
          status = json.loads(status_path.read_text(encoding="utf-8"))
          if int(status.get("universe") or 0) < 100:
              raise SystemExit(f"universo histórico inesperadamente pequeno: {status.get('universe')}")
          if int(status.get("updatedThisRun") or 0) < 10:
              raise SystemExit(f"lote histórico insuficiente: {status.get('updatedThisRun')}")
          print(
              f"universo={status.get('universe')} lote={status.get('batchSize')} "
              f"cobertos={status.get('covered')} faltando={status.get('missing')} "
              f"cobertura={status.get('coveragePct')}%"
          )
          PY

      - name: Publicar cache
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/history/
          git diff --cached --quiet && exit 0
          git commit -m "Atualizar cache histórico diário"
          for tentativa in 1 2 3; do
            git fetch origin main
            git rebase -X theirs origin/main
            if git push origin HEAD:main; then
              exit 0
            fi
            echo "Branch avançou; repetindo publicação ${tentativa}/3."
          done
          exit 1
