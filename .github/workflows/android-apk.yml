name: Gerar APK Android

on:
  push:
    branches: [main]
    paths:
      - "site/**"
      - ".github/workflows/android-apk.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  debug-apk:
    name: Build APK de teste
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: site
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: site/package-lock.json
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - name: Instalar dependências
        run: npm ci
      - name: Gerar frontend para Android
        run: npm run build:android
      - name: Criar projeto nativo e sincronizar assets
        run: |
          npx cap add android
          npx cap sync android
      - name: Compilar APK instalável
        run: cd android && ./gradlew assembleDebug
      - name: Disponibilizar APK
        uses: actions/upload-artifact@v4
        with:
          name: b3-score-android-debug-apk
          path: site/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
