name: Gerar APK Android

on:
  push:
    branches: [main]
    paths:
      - "site/**"
      - ".github/workflows/android-apk.yml"
  workflow_dispatch:

permissions:
  contents: write
  actions: read

concurrency:
  group: android-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  debug-apk:
    name: Build APK de teste
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: site
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: site/package-lock.json

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Instalar dependências
        run: npm ci

      - name: Gerar frontend para Android
        run: npm run build:android

      - name: Criar projeto nativo e sincronizar assets
        run: |
          if [ ! -d android ]; then
            npx cap add android
          fi
          npx cap sync android

      - name: Compilar APK instalável
        run: cd android && ./gradlew assembleDebug

      - name: Preparar APK com nome estável
        run: cp android/app/build/outputs/apk/debug/app-debug.apk android/app/build/outputs/apk/debug/b3-score.apk

      - name: Disponibilizar APK como artefato
        uses: actions/upload-artifact@v4
        with:
          name: b3-score-android-debug-apk
          path: site/android/app/build/outputs/apk/debug/b3-score.apk
          if-no-files-found: error
          retention-days: 14

      - name: Publicar APK em release fixa
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cd ..
          if gh release view b3-score-latest >/dev/null 2>&1; then
            gh release upload b3-score-latest site/android/app/build/outputs/apk/debug/b3-score.apk --clobber
          else
            gh release create b3-score-latest site/android/app/build/outputs/apk/debug/b3-score.apk --title "B3 Score Android - Última versão" --notes "APK de teste gerado automaticamente a partir da branch main."
          fi

      - name: Registrar diagnóstico do APK
        if: always()
        shell: bash
        run: |
          cd "$GITHUB_WORKSPACE"
          mkdir -p .build-status
          {
            echo "commit=$GITHUB_SHA"
            echo "run_id=$GITHUB_RUN_ID"
            echo "run_attempt=$GITHUB_RUN_ATTEMPT"
            echo "workflow=$GITHUB_WORKFLOW"
            echo "generated_at=$(date -u +%Y-%m-%dT%H:%M:%SZ)"
            if [ -f site/android/app/build/outputs/apk/debug/b3-score.apk ]; then
              echo "apk_status=READY"
              echo "apk_path=site/android/app/build/outputs/apk/debug/b3-score.apk"
              stat -c "apk_size=%s" site/android/app/build/outputs/apk/debug/b3-score.apk || true
            else
              echo "apk_status=NOT_READY"
            fi
          } > .build-status/android-build.txt
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .build-status/android-build.txt
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "chore: registrar diagnostico do build Android"
          git pull --rebase origin main
          git push origin HEAD:main
