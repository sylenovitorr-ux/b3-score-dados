name: Gerar APK Android

on:
  push:
    branches: [main]
    paths:
      - "site/**"
      - ".github/workflows/android-apk.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: android-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  debug-apk:
    name: Build APK de teste
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: site
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: site/package-lock.json
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - name: Instalar dependências
        run: npm ci
      - name: Gerar frontend para Android
        run: npm run build:android
      - name: Criar projeto nativo e sincronizar assets
        run: |
          npx cap add android
          npx cap sync android
      - name: Compilar APK instalável
        run: cd android && ./gradlew assembleDebug
      - name: Preparar APK com nome estável
        run: cp android/app/build/outputs/apk/debug/app-debug.apk android/app/build/outputs/apk/debug/b3-score.apk
      - name: Disponibilizar APK como artefato
        uses: actions/upload-artifact@v4
        with:
          name: b3-score-android-debug-apk
          path: site/android/app/build/outputs/apk/debug/b3-score.apk
          if-no-files-found: error
          retention-days: 14
      - name: Publicar APK em release fixa
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cd ..
          if gh release view b3-score-latest >/dev/null 2>&1; then
            gh release upload b3-score-latest site/android/app/build/outputs/apk/debug/b3-score.apk --clobber
          else
            gh release create b3-score-latest site/android/app/build/outputs/apk/debug/b3-score.apk --title "B3 Score Android - Última versão" --notes "APK de teste gerado automaticamente a partir da branch main."
          fi
