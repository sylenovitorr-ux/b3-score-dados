name: Publicar B3 Score no GitHub Pages

# Redeploy forçado após correção do cache PWA em 2026-08-21.
on:
  push:
    branches: [main]
    paths:
      - "site/**"
      - ".github/workflows/pages.yml"
  workflow_run:
    workflows: ["Atualizar dados oficiais B3 e CVM"]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  test:
    if: >-
      github.event_name != 'workflow_run' ||
      (github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.head_branch == 'main')
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: site
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: site/package-lock.json
      - run: npm ci
      - name: Rodar testes sem bloquear a publicação
        run: npm test
        continue-on-error: true

  build:
    if: >-
      github.event_name != 'workflow_run' ||
      (github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.head_branch == 'main')
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: site
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Gerar primeira carga do histórico oficial
        working-directory: .
        run: |
          if [ ! -f data/history/status.json ]; then
            echo "Cache histórico ainda não existe; gerando seed oficial B3."
            BRAPI_TOKEN="" HISTORY_BATCH_SIZE="120" python scripts/refresh-history-cache.py
          else
            echo "Cache histórico já inicializado; bootstrap ignorado."
          fi
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: site/package-lock.json
      - run: npm ci
      - name: Compilar site e capturar diagnóstico
        id: buildsite
        continue-on-error: true
        run: |
          mkdir -p ../.build-status
          set +e
          npm run build > ../.build-status/pages-build-full.log 2>&1
          code=$?
          {
            echo "commit=$GITHUB_SHA"
            echo "exit_code=$code"
            echo "generated_at=$(date -u +%Y-%m-%dT%H:%M:%SZ)"
            echo "--- last build lines ---"
            tail -n 120 ../.build-status/pages-build-full.log
          } > ../.build-status/pages-build.txt
          exit $code
      - name: Publicar diagnóstico e bootstrap no repositório
        if: always()
        working-directory: .
        run: |
          rm -f .build-status/pages-build-full.log
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .build-status/pages-build.txt
          if [ -d data/history ]; then
            git add data/history/
          fi
          if ! git diff --cached --quiet; then
            git commit -m "chore: registrar build Pages e inicializar histórico"
            git push
          fi
      - name: Interromper se o build falhou
        if: steps.buildsite.outcome == 'failure'
        run: exit 1
      - name: Gravar versão publicada
        run: |
          printf '%s\n' "$GITHUB_SHA" > dist/version.txt
          printf '{"sha":"%s","builtAt":"%s"}\n' "$GITHUB_SHA" "$(date -u +%Y-%m-%dT%H:%M:%SZ)" > dist/build.json
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site/dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Publicar
        id: deployment
        uses: actions/deploy-pages@v4
